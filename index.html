<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>디데이 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2ECDD; --paper-2:#E8DEC4; --dot:rgba(43,42,40,.12);
  --ink:#2B2A28; --ink-soft:#6E6858; --ink-faint:#A49C87;
  --line:#D9CFB3; --card:#FFFDF6; --shadow:0 6px 18px rgba(43,42,40,.12);
  --sunday:#D6336C; --saturday:#3D5A80;
  --c-exam:#E4572E; --c-interview:#3D5A80; --c-presentation:#DA9A1F;
  --c-birthday:#D6336C; --c-travel:#2E9E83; --c-anniversary:#8B5CF6; --c-etc:#6B7AA1;
  --gold:#F0A22E; --gold2:#E4572E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#221F1A; --paper-2:#2B2720; --dot:rgba(242,236,221,.09);
    --ink:#F1EBDD; --ink-soft:#BBB2A0; --ink-faint:#7E7768;
    --line:#45402F; --card:#2C2820; --shadow:0 6px 18px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#221F1A; --paper-2:#2B2720; --dot:rgba(242,236,221,.09);
  --ink:#F1EBDD; --ink-soft:#BBB2A0; --ink-faint:#7E7768;
  --line:#45402F; --card:#2C2820; --shadow:0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/22px 22px,var(--paper);
  color:var(--ink); font-family:'Noto Serif KR',serif; min-height:100%;}
.num{font-family:'Outfit',sans-serif;}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 70px;}
header{position:relative;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;}
.tape{position:absolute;top:-14px;left:18px;width:92px;height:28px;
  background:repeating-linear-gradient(135deg,#E7D9A8,#E7D9A8 6px,#DDCB90 6px,#DDCB90 12px);
  opacity:.85;transform:rotate(-5deg);box-shadow:0 2px 4px rgba(0,0,0,.12);}
h1{font-family:'Gaegu',cursive;font-size:clamp(26px,6vw,36px);font-weight:700;margin:10px 0 4px;}
.subtitle{color:var(--ink-soft);font-size:13px;margin:0;}
.gear{background:none;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;
  font-size:17px;cursor:pointer;color:var(--ink-soft);flex-shrink:0;margin-top:8px;}
.gear:hover{color:var(--ink);background:var(--paper-2);}

.ai-banner{margin:18px 0;padding:14px 16px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;}
.ai-banner .emoji{font-size:22px;line-height:1;}
.ai-banner p{margin:0;font-size:14.5px;line-height:1.5;}

.month-nav{display:flex;align-items:center;justify-content:center;gap:6px;margin:22px 0 10px;flex-wrap:wrap;}
.month-nav button{background:none;border:none;cursor:pointer;font-size:20px;color:var(--ink-soft);
  padding:2px 10px;border-radius:50%;}
.month-nav button:hover{color:var(--ink);background:var(--paper-2);}
.month-nav select{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;border:none;
  background:transparent;color:var(--ink);cursor:pointer;padding:4px 2px;}
.btn-today{font-family:'Noto Serif KR',serif;font-size:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);border-radius:14px;padding:5px 12px;cursor:pointer;}
.btn-today:hover{color:var(--ink);}
.month-icons{text-align:center;font-size:15px;margin-bottom:4px;letter-spacing:4px;min-height:18px;}

.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);}
.weekdays span{text-align:center;font-size:11.5px;color:var(--ink-faint);padding-bottom:6px;font-weight:500;}
.weekdays span:first-child{color:var(--sunday);} .weekdays span:last-child{color:var(--saturday);}
.day-cell{min-height:78px;border-top:1px solid var(--line);padding:5px 3px 3px;position:relative;
  cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:background .15s;border-radius:4px;}
.day-cell:hover{background:var(--paper-2);}
.day-cell.empty{cursor:default;} .day-cell.empty:hover{background:none;}
.day-num{font-family:'Outfit',sans-serif;font-size:12.5px;color:var(--ink-soft);}
.day-cell.sunday .day-num{color:var(--sunday);} .day-cell.saturday .day-num{color:var(--saturday);}
.day-cell.is-today .day-num{display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;}
.day-cell.is-selected{box-shadow:inset 0 0 0 2px var(--ink);}
.day-cell.is-holiday .day-num::after{content:'';}
.holiday-tag{font-size:9px;color:var(--sunday);font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip{font-size:10px;padding:1.5px 4px;border-radius:3px;color:#fff;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Gaegu',cursive;}
.chip.today-chip{font-weight:700;background:linear-gradient(120deg,var(--gold),var(--gold2));}
.anim-on .chip.today-chip{animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.more-tag{font-size:9.5px;color:var(--ink-faint);}
.day-cell.has-today{box-shadow:inset 0 0 0 2px var(--gold2);}

.section-title{font-family:'Gaegu',cursive;font-size:19px;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:8px;}

.today-plan{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow);}
.plan-lead{font-size:14px;margin:0 0 10px;color:var(--ink-soft);}
.plan-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);}
.plan-item:first-child{border-top:none;}
.plan-time{font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;min-width:48px;color:var(--ink-soft);}
.plan-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.plan-title{flex:1;font-size:14px;}
.plan-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.plan-status.done{background:var(--paper-2);color:var(--ink-faint);}
.plan-status.next{background:var(--gold2);color:#fff;}
.plan-note{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

.list{display:flex;flex-direction:column;gap:9px;}
.event-card{background:var(--card);border:1px solid var(--line);border-left-width:5px;
  border-radius:4px;padding:11px 13px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;}
.dday-badge{font-family:'Gaegu',cursive;font-weight:700;font-size:18px;min-width:54px;text-align:center;
  padding:5px 4px;border-radius:3px;color:#fff;flex-shrink:0;}
.event-info{flex:1;min-width:0;}
.event-title{font-size:14.5px;font-weight:500;word-break:break-word;}
.event-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
.cat-icon{font-size:13px;}
.icon-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:4px 5px;flex-shrink:0;}
.icon-btn:hover{color:var(--ink);}
.icon-btn.del:hover{color:var(--sunday);}
.event-card.is-today{animation:glow 1.8s ease-in-out infinite;}
.anim-off .event-card.is-today{animation:none;}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(228,87,46,.18);}50%{box-shadow:0 6px 26px rgba(228,87,46,.4);}}
.event-card.is-today .dday-badge{background:linear-gradient(120deg,var(--gold),var(--gold2));font-size:14px;}
.event-card.is-past{opacity:.5;}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti span{position:absolute;top:-10px;width:6px;height:10px;opacity:.85;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(90px) rotate(360deg);opacity:0;}}
.empty-state{color:var(--ink-faint);font-family:'Gaegu',cursive;font-size:15px;padding:14px 4px;}

.selected-panel{margin-top:10px;}
.selected-panel .list{margin-top:10px;}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0;font-size:11.5px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

.fab{position:fixed;right:18px;bottom:env(safe-area-inset-bottom,22px);width:54px;height:54px;border-radius:50%;
  background:var(--ink);color:var(--paper);border:none;font-size:26px;cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;}
.fab:hover{transform:scale(1.06);}

.overlay{position:fixed;inset:0;background:rgba(43,42,40,.45);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:10;}
.overlay.open{display:flex;}
.modal{background:var(--card);border-radius:8px;padding:22px 20px;width:100%;max-width:380px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);max-height:88vh;overflow-y:auto;}
.modal h2{font-family:'Gaegu',cursive;font-size:19px;margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:4px;
  font-family:'Noto Serif KR',serif;font-size:13.5px;background:var(--paper);color:var(--ink);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.modal-actions button{padding:8px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px;}
.btn-cancel{background:transparent;color:var(--ink-soft);}
.btn-save{background:var(--ink);color:var(--paper);font-weight:600;}
.btn-danger{background:var(--sunday);color:#fff;font-weight:600;}

.confirm-text{font-size:13.5px;line-height:1.6;margin:0 0 4px;}
.confirm-sub{font-size:12px;color:var(--ink-faint);margin:0 0 4px;}

.settings-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line);}
.settings-row:first-of-type{border-top:none;}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--line);border-radius:22px;cursor:pointer;transition:.15s;}
.slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.15s;}
input:checked + .slider{background:var(--gold2);}
input:checked + .slider::before{transform:translateX(18px);}

@media (prefers-reduced-motion: reduce){.anim-on .chip.today-chip,.event-card.is-today,.confetti span{animation:none!important;}}
</style>
</head>
<body class="anim-on">
<div class="wrap">
  <header>
    <div>
      <div class="tape"></div>
      <h1>디데이 다이어리</h1>
      <p class="subtitle">시험도, 약속도, 다가올수록 진해지는 하루하루.</p>
    </div>
    <button class="gear" id="btnSettings" aria-label="설정">⚙</button>
  </header>

  <div class="ai-banner" id="aiBanner"></div>

  <div class="month-nav">
    <button id="prevYear" aria-label="이전 연도">«</button>
    <button id="prevMonth" aria-label="이전 달">‹</button>
    <select id="selYear"></select>
    <select id="selMonth"></select>
    <button id="nextMonth" aria-label="다음 달">›</button>
    <button id="nextYear" aria-label="다음 연도">»</button>
    <button class="btn-today" id="btnToday">오늘</button>
  </div>
  <div class="month-icons" id="monthIcons"></div>

  <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="days" id="daysGrid"></div>
  <div class="legend" id="legend"></div>

  <div class="selected-panel" id="selectedPanel"></div>

  <h2 class="section-title">📋 오늘 뭐 해야 하지?</h2>
  <div class="today-plan" id="todayPlan"></div>

  <h2 class="section-title">🗓 다가오는 일정</h2>
  <div class="list" id="upcomingList"></div>
</div>

<button class="fab" id="fabAdd" aria-label="일정 추가">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 일정</h2>
    <div class="field"><label for="inputTitle">무슨 일이야?</label>
      <input type="text" id="inputTitle" placeholder="예: 중간고사, 소개팅, 발표"></div>
    <div class="field"><label for="inputCategory">종류</label>
      <select id="inputCategory"></select></div>
    <div class="field"><label for="inputDate">날짜</label><input type="date" id="inputDate"></div>
    <div class="row2">
      <div class="field"><label for="inputStart">시작 시간 (선택)</label><input type="time" id="inputStart"></div>
      <div class="field"><label for="inputEnd">종료 시간 (선택)</label><input type="time" id="inputEnd"></div>
    </div>
    <div class="field"><label for="inputPrep">준비 시간 (분, 선택)</label><input type="number" id="inputPrep" min="0" step="5" placeholder="예: 30"></div>
    <div class="field"><label for="inputRepeat">반복</label>
      <select id="inputRepeat">
        <option value="none">반복하지 않음</option>
        <option value="year">매년 반복</option>
      </select></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-save" id="btnSave">저장</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal" style="max-width:300px;">
    <h2>일정을 삭제할까요?</h2>
    <p class="confirm-text" id="confirmTitle"></p>
    <p class="confirm-sub" id="confirmDate"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="confirmCancel">취소</button>
      <button class="btn-danger" id="confirmDelete">삭제</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal" style="max-width:300px;">
    <h2>설정</h2>
    <div class="settings-row">
      <span>화려한 애니메이션 효과</span>
      <label class="switch"><input type="checkbox" id="toggleAnim" checked><span class="slider"></span></label>
    </div>
    <div class="modal-actions"><button class="btn-save" id="closeSettings">닫기</button></div>
  </div>
</div>

<script>
(function(){
const EV_KEY='dday-diary-events', SET_KEY='dday-diary-settings';
const CATS={
  exam:{label:'시험',icon:'📝',color:'var(--c-exam)'},
  interview:{label:'면접',icon:'💼',color:'var(--c-interview)'},
  presentation:{label:'발표',icon:'🎤',color:'var(--c-presentation)'},
  birthday:{label:'생일',icon:'🎂',color:'var(--c-birthday)'},
  travel:{label:'여행',icon:'✈️',color:'var(--c-travel)'},
  anniversary:{label:'기념일',icon:'💐',color:'var(--c-anniversary)'},
  etc:{label:'약속',icon:'📌',color:'var(--c-etc)'}
};
const KEYMAP=[['생일','birthday'],['시험','exam'],['고사','exam'],['퀴즈','exam'],
  ['면접','interview'],['발표','presentation'],['프리젠','presentation'],
  ['여행','travel'],['기념일','anniversary'],['기념','anniversary']];
function detectCategory(title){
  for(const [kw,cat] of KEYMAP){ if(title.includes(kw)) return cat; }
  return 'etc';
}
const MSG={
  exam:['지금까지 준비한 만큼 차분하게 실력을 보여주세요!','긴장하지 말고 아는 것부터 차근차근 풀어봐요.','여기까지 온 것만으로도 충분히 잘하고 있어요.'],
  interview:['자신감을 가지고 천천히 이야기해보세요!','준비한 당신의 모습 그대로 보여주면 충분해요.','떨려도 괜찮아요, 진심은 전달됩니다.'],
  presentation:['준비한 내용을 자신 있게 보여주세요!','연습한 만큼 편하게, 천천히 말해보세요.','당신의 아이디어를 믿고 당당하게!'],
  birthday:['오늘은 특별한 생일이에요! 행복한 하루 보내세요 🎂','태어나줘서 고마운 하루! 맘껏 축하받으세요 🎉','1년에 한 번뿐인 날, 실컷 웃어요!'],
  travel:['오늘은 여행을 떠나는 날이에요. 즐거운 추억을 만들어보세요!','새로운 풍경이 기다리고 있어요, 안전하게 다녀오세요!','짐 잘 챙기고, 설레는 마음으로 출발!'],
  anniversary:['소중한 사람과 의미 있는 하루 보내세요 💐','오늘을 기억하며, 따뜻한 하루 되길!'],
  etc:['오늘 일정, 여유 있게 준비해보세요.','하나씩 차근차근이면 충분해요.']
};
const GENERIC=['오늘도 좋은 하루 보내세요 ☀️','잔잔한 하루, 그 자체로 소중해요.','작은 일도 꾸준히 하면 큰 힘이 됩니다.','오늘 하루도 당신을 응원해요!'];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function pick(arr,seed){return arr[hashStr(seed)%arr.length];}

// ---- holiday data ----
const HOLIDAYS_2026=[
  ['2026-01-01','신정'],['2026-02-16','설날 연휴'],['2026-02-17','설날'],['2026-02-18','설날 연휴'],
  ['2026-03-01','삼일절'],['2026-03-02','대체공휴일'],['2026-05-05','어린이날'],
  ['2026-05-24','부처님오신날'],['2026-05-25','대체공휴일'],['2026-06-03','임시공휴일(지방선거)'],
  ['2026-06-06','현충일'],['2026-07-17','제헌절'],['2026-08-15','광복절'],['2026-08-17','대체공휴일'],
  ['2026-09-24','추석 연휴'],['2026-09-25','추석'],['2026-09-26','추석 연휴'],
  ['2026-10-03','개천절'],['2026-10-05','대체공휴일'],['2026-10-09','한글날'],['2026-12-25','크리스마스']
];
const FIXED=[[1,1,'신정'],[3,1,'삼일절'],[5,5,'어린이날'],[6,6,'현충일'],[8,15,'광복절'],[10,3,'개천절'],[10,9,'한글날'],[12,25,'크리스마스']];
function holidaysOfYear(y){
  if(y===2026) return HOLIDAYS_2026;
  return FIXED.map(([m,d,name])=>[`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,name]);
}
function holidayMapForYear(y){
  const m={}; holidaysOfYear(y).forEach(([k,n])=>m[k]=n); return m;
}

let events=[]; let settings={anim:true};
try{const r=localStorage.getItem(EV_KEY); events=r?JSON.parse(r):[];}catch(e){events=[];}
try{const r=localStorage.getItem(SET_KEY); if(r) settings=JSON.parse(r);}catch(e){}
function saveEvents(){try{localStorage.setItem(EV_KEY,JSON.stringify(events));}catch(e){}}
function saveSettings(){try{localStorage.setItem(SET_KEY,JSON.stringify(settings));}catch(e){}}
function applyAnim(){document.body.classList.toggle('anim-on',settings.anim);document.body.classList.toggle('anim-off',!settings.anim);}

function todayDate(){const d=new Date();d.setHours(0,0,0,0);return d;}
function parseDate(str){const [y,m,d]=str.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt;}
function toKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function daysBetween(target){return Math.round((target-todayDate())/86400000);}
function lerp(t){t=Math.max(0,Math.min(1,t));const r=Math.round(107+(224-107)*t),g=Math.round(122+(87-122)*t),b=Math.round(161+(46-161)*t);return `rgb(${r},${g},${b})`;}
function colorForDays(d){if(d<=0)return null; const t=1-Math.min(d,21)/21; return lerp(t);}
function ddayLabel(d){if(d===0)return'D-DAY'; if(d>0)return `D-${d}`; return `D+${Math.abs(d)}`;}

// expand an event into occurrence dates near a target year range
function occurrenceInYear(ev,year){
  const [y,m,d]=ev.date.split('-').map(Number);
  if(ev.repeat==='year'){
    if(year<y) return null;
    return `${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return y===year?ev.date:null;
}
function eventsForMonth(year,month){ // month 0-indexed, returns [{...ev, occDate}]
  const out=[];
  events.forEach(ev=>{
    const occ=occurrenceInYear(ev,year);
    if(occ){ const [oy,om]=occ.split('-').map(Number); if(om-1===month) out.push(Object.assign({},ev,{occDate:occ})); }
  });
  return out;
}
function eventsOnDate(key){
  const [y]=key.split('-').map(Number);
  const out=[];
  events.forEach(ev=>{ const occ=occurrenceInYear(ev,y); if(occ===key) out.push(Object.assign({},ev,{occDate:occ})); });
  return out;
}
// upcoming: within next ~2 years, nearest occurrence per event (today or future)
function nextOccurrence(ev){
  const t=todayDate();
  for(let yy=t.getFullYear(); yy<=t.getFullYear()+2; yy++){
    const occ=occurrenceInYear(ev,yy);
    if(occ && parseDate(occ)>=t) return occ;
  }
  return null;
}

let viewYear, viewMonth, selectedKey=null;
const now=new Date(); viewYear=now.getFullYear(); viewMonth=now.getMonth();

const daysGrid=document.getElementById('daysGrid');
const selYear=document.getElementById('selYear'), selMonth=document.getElementById('selMonth');
const monthIcons=document.getElementById('monthIcons');
const upcomingList=document.getElementById('upcomingList');
const selectedPanel=document.getElementById('selectedPanel');
const todayPlan=document.getElementById('todayPlan');
const aiBanner=document.getElementById('aiBanner');
const legend=document.getElementById('legend');

function fillSelectors(){
  selYear.innerHTML=''; const ty=now.getFullYear();
  for(let y=ty-3;y<=ty+6;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'년';selYear.appendChild(o);}
  selYear.value=viewYear;
  selMonth.innerHTML='';
  for(let m=0;m<12;m++){const o=document.createElement('option');o.value=m;o.textContent=(m+1)+'월';selMonth.appendChild(o);}
  selMonth.value=viewMonth;
}

function renderLegend(){
  legend.innerHTML=Object.entries(CATS).map(([k,c])=>`<span><i style="background:${c.color}"></i>${c.icon} ${c.label}</span>`).join('');
}

function renderAIBanner(){
  const t=todayDate(), key=toKey(t.getFullYear(),t.getMonth(),t.getDate());
  const todays=eventsOnDate(key);
  if(todays.length>0){
    const ev=todays[0];
    const cat=ev.category||detectCategory(ev.title);
    const msg=pick(MSG[cat]||MSG.etc, key+ev.title);
    aiBanner.innerHTML=`<span class="emoji">${CATS[cat].icon}</span><p><strong>${ev.title}</strong> — ${msg}</p>`;
  } else {
    aiBanner.innerHTML=`<span class="emoji">💬</span><p>${pick(GENERIC,key)}</p>`;
  }
}

function renderMonthIcons(){
  const list=eventsForMonth(viewYear,viewMonth);
  const cats=[...new Set(list.map(e=>e.category||detectCategory(e.title)))].filter(c=>c!=='etc');
  monthIcons.textContent=cats.map(c=>CATS[c].icon).join(' ');
}

function renderCalendar(){
  daysGrid.innerHTML='';
  const firstDay=new Date(viewYear,viewMonth,1).getDay();
  const numDays=new Date(viewYear,viewMonth+1,0).getDate();
  const t=todayDate();
  const hMap=holidayMapForYear(viewYear);
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='day-cell empty';daysGrid.appendChild(e);}
  for(let day=1;day<=numDays;day++){
    const cell=document.createElement('div');
    const cellDate=new Date(viewYear,viewMonth,day);
    const key=toKey(viewYear,viewMonth,day);
    const weekday=cellDate.getDay();
    cell.className='day-cell';
    if(weekday===0||hMap[key])cell.classList.add('sunday');
    if(weekday===6)cell.classList.add('saturday');
    if(cellDate.getTime()===t.getTime())cell.classList.add('is-today');
    if(key===selectedKey)cell.classList.add('is-selected');
    cell.tabIndex=0; cell.setAttribute('role','button'); cell.setAttribute('aria-label',`${viewMonth+1}월 ${day}일`);
    const num=document.createElement('div'); num.className='day-num num'; num.textContent=day; cell.appendChild(num);
    if(hMap[key]){const h=document.createElement('div'); h.className='holiday-tag'; h.textContent='🎉 '+hMap[key]; cell.appendChild(h);}
    const dayEvents=eventsOnDate(key);
    let hasToday=false;
    dayEvents.slice(0,2).forEach(ev=>{
      const diff=daysBetween(parseDate(ev.occDate));
      const cat=ev.category||detectCategory(ev.title);
      const chip=document.createElement('div'); chip.className='chip';
      chip.textContent=`${CATS[cat].icon}${ddayLabel(diff)}`;
      if(diff===0){chip.classList.add('today-chip');hasToday=true;}
      else{chip.style.background=colorForDays(diff)||CATS[cat].color;}
      cell.appendChild(chip);
    });
    if(dayEvents.length>2){const more=document.createElement('div');more.className='more-tag';more.textContent=`+${dayEvents.length-2}`;cell.appendChild(more);}
    if(hasToday)cell.classList.add('has-today');
    cell.addEventListener('click',()=>{selectedKey=key;renderCalendar();renderSelectedPanel();});
    cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectedKey=key;renderCalendar();renderSelectedPanel();}});
    daysGrid.appendChild(cell);
  }
}

function fmtTime(hm){ if(!hm) return ''; const [h,m]=hm.split(':').map(Number); const ap=h<12?'오전':'오후'; const hh=h%12===0?12:h%12; return `${ap} ${hh}:${String(m).padStart(2,'0')}`; }

function renderSelectedPanel(){
  if(!selectedKey){selectedPanel.innerHTML='';return;}
  const d=parseDate(selectedKey);
  const list=eventsOnDate(selectedKey).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));
  let html=`<h2 class="section-title">📍 ${d.getMonth()+1}월 ${d.getDate()}일 일정</h2><div class="list">`;
  if(list.length===0){ html+='<div class="empty-state">이 날엔 아직 일정이 없어요.</div>'; }
  list.forEach(ev=>{
    const cat=ev.category||detectCategory(ev.title);
    const diff=daysBetween(parseDate(ev.occDate));
    html+=eventCardHTML(ev,cat,diff);
  });
  html+='</div>';
  selectedPanel.innerHTML=html;
  bindCardButtons(selectedPanel);
}

function eventCardHTML(ev,cat,diff){
  const isToday=diff===0, isPast=diff<0;
  const badgeBg=isToday?'':`background:${colorForDays(diff)||CATS[cat].color};`;
  const timeStr=ev.start?`${fmtTime(ev.start)}${ev.end?' ~ '+fmtTime(ev.end):''}`:'';
  return `<div class="event-card ${isToday?'is-today':''} ${isPast?'is-past':''}" style="border-left-color:${CATS[cat].color}" data-id="${ev.id}" data-occ="${ev.occDate}">
    <div class="dday-badge" style="${badgeBg}">${ddayLabel(diff)}</div>
    <div class="event-info">
      <div class="event-title">${CATS[cat].icon} ${escapeHtml(ev.title)}${ev.repeat==='year'?' 🔁':''}</div>
      <div class="event-meta">${timeStr?`<span>${timeStr}</span>`:''}<span>${CATS[cat].label}</span></div>
    </div>
    <button class="icon-btn edit" aria-label="수정">✎</button>
    <button class="icon-btn del" aria-label="삭제">×</button>
    ${isToday?'<div class="confetti">'+confettiSpans()+'</div>':''}
  </div>`;
}
function confettiSpans(){
  const colors=['#E4572E','#F0A22E','#3D5A80','#8FB339'];let s='';
  for(let i=0;i<12;i++){const left=Math.random()*100,delay=Math.random()*1.4,dur=1.6+Math.random()*1.2,c=colors[i%colors.length];
    s+=`<span style="left:${left}%;background:${c};animation-delay:${delay}s;animation-duration:${dur}s;"></span>`;}
  return s;
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function bindCardButtons(container){
  container.querySelectorAll('.event-card').forEach(card=>{
    const id=card.dataset.id;
    const ev=events.find(e=>e.id===id);
    card.querySelector('.edit').addEventListener('click',()=>openModal(card.dataset.occ,ev));
    card.querySelector('.del').addEventListener('click',()=>openConfirm(ev));
  });
}

function renderTodayPlan(){
  const t=new Date(); const key=toKey(t.getFullYear(),t.getMonth(),t.getDate());
  let list=eventsOnDate(key).map(ev=>Object.assign({},ev,{cat:ev.category||detectCategory(ev.title)}));
  list.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));
  if(list.length===0){ todayPlan.innerHTML='<p class="plan-lead">오늘은 등록된 일정이 없어요. 여유로운 하루 보내세요!</p>'; return; }
  const nowMin=t.getHours()*60+t.getMinutes();
  let nextFound=false, html='';
  list.forEach(ev=>{
    let status='', statusCls='', note='';
    if(ev.start){
      const [h,m]=ev.start.split(':').map(Number); const evMin=h*60+m;
      if(evMin<nowMin){status='완료';statusCls='done';}
      else if(!nextFound){
        status='다음 일정'; statusCls='next'; nextFound=true;
        const diffMin=evMin-nowMin; const hh=Math.floor(diffMin/60), mm=diffMin%60;
        note=`다음 일정까지 ${hh>0?hh+'시간 ':''}${mm}분 남았어요.`;
        if(ev.prep){ const prepMin=evMin-ev.prep; const ph=Math.floor(((prepMin%1440)+1440)%1440/60), pm=((prepMin%1440)+1440)%1440%60;
          note+= ` ${String(ph).padStart(2,'0')}:${String(pm).padStart(2,'0')}에 준비를 시작하는 게 좋아요.`; }
      }
    } else { status='하루 종일'; statusCls='done'; }
    html+=`<div class="plan-item"><span class="plan-time num">${ev.start?fmtTime(ev.start):'종일'}</span>
      <span class="plan-dot" style="background:${CATS[ev.cat].color}"></span>
      <div style="flex:1"><div class="plan-title">${CATS[ev.cat].icon} ${escapeHtml(ev.title)}</div>${note?`<div class="plan-note">${note}</div>`:''}</div>
      <span class="plan-status ${statusCls}">${status}</span></div>`;
  });
  todayPlan.innerHTML=html;
}

function renderUpcoming(){
  upcomingList.innerHTML='';
  const withOcc=events.map(ev=>{const occ=nextOccurrence(ev); return occ?Object.assign({},ev,{occDate:occ}):null;}).filter(Boolean);
  if(withOcc.length===0){ upcomingList.innerHTML='<div class="empty-state">아직 적어둔 일정이 없어. + 버튼을 눌러서 시작해봐.</div>'; return; }
  withOcc.sort((a,b)=>parseDate(a.occDate)-parseDate(b.occDate));
  withOcc.forEach(ev=>{
    const cat=ev.category||detectCategory(ev.title);
    const diff=daysBetween(parseDate(ev.occDate));
    const wrap=document.createElement('div'); wrap.innerHTML=eventCardHTML(ev,cat,diff);
    upcomingList.appendChild(wrap.firstElementChild);
  });
  bindCardButtons(upcomingList);
}

function renderAll(){ fillSelectors(); renderAIBanner(); renderMonthIcons(); renderCalendar(); renderLegend(); renderSelectedPanel(); renderTodayPlan(); renderUpcoming(); }

// modal (add / edit)
const overlay=document.getElementById('overlay');
const inputTitle=document.getElementById('inputTitle'), inputDate=document.getElementById('inputDate');
const inputCategory=document.getElementById('inputCategory'), inputStart=document.getElementById('inputStart');
const inputEnd=document.getElementById('inputEnd'), inputPrep=document.getElementById('inputPrep'), inputRepeat=document.getElementById('inputRepeat');
Object.entries(CATS).forEach(([k,c])=>{const o=document.createElement('option');o.value=k;o.textContent=`${c.icon} ${c.label}`;inputCategory.appendChild(o);});
let editingId=null;
function openModal(prefillDate,editEv){
  editingId=editEv?editEv.id:null;
  document.getElementById('modalTitle').textContent=editEv?'일정 수정':'새 일정';
  inputTitle.value=editEv?editEv.title:'';
  inputDate.value=prefillDate||toKey(now.getFullYear(),now.getMonth(),now.getDate());
  inputCategory.value=editEv?(editEv.category||detectCategory(editEv.title)):'etc';
  inputStart.value=editEv?(editEv.start||''):'';
  inputEnd.value=editEv?(editEv.end||''):'';
  inputPrep.value=editEv&&editEv.prep?editEv.prep:'';
  inputRepeat.value=editEv?editEv.repeat||'none':'none';
  overlay.classList.add('open');
  setTimeout(()=>inputTitle.focus(),50);
}
function closeModal(){overlay.classList.remove('open');editingId=null;}
document.getElementById('fabAdd').addEventListener('click',()=>openModal(selectedKey));
document.getElementById('btnCancel').addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.getElementById('btnSave').addEventListener('click',()=>{
  const title=inputTitle.value.trim(), date=inputDate.value;
  if(!title||!date){inputTitle.focus();return;}
  const data={title,date,category:inputCategory.value,start:inputStart.value||'',end:inputEnd.value||'',
    prep:inputPrep.value?parseInt(inputPrep.value,10):0, repeat:inputRepeat.value};
  if(editingId){ const idx=events.findIndex(e=>e.id===editingId); if(idx>-1) events[idx]=Object.assign(events[idx],data); }
  else { events.push(Object.assign({id:Date.now()+'-'+Math.random().toString(36).slice(2,7)},data)); }
  saveEvents(); closeModal(); renderAll();
});

// confirm delete
const confirmOverlay=document.getElementById('confirmOverlay');
let pendingDeleteId=null;
function openConfirm(ev){
  pendingDeleteId=ev.id;
  document.getElementById('confirmTitle').textContent=`"${ev.title}"`;
  const d=parseDate(ev.date);
  document.getElementById('confirmDate').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일${ev.repeat==='year'?' (매년 반복)':''}`;
  confirmOverlay.classList.add('open');
}
document.getElementById('confirmCancel').addEventListener('click',()=>confirmOverlay.classList.remove('open'));
confirmOverlay.addEventListener('click',e=>{if(e.target===confirmOverlay)confirmOverlay.classList.remove('open');});
document.getElementById('confirmDelete').addEventListener('click',()=>{
  events=events.filter(e=>e.id!==pendingDeleteId); saveEvents(); confirmOverlay.classList.remove('open'); renderAll();
});

// settings
const settingsOverlay=document.getElementById('settingsOverlay');
const toggleAnim=document.getElementById('toggleAnim');
toggleAnim.checked=settings.anim; applyAnim();
document.getElementById('btnSettings').addEventListener('click',()=>settingsOverlay.classList.add('open'));
document.getElementById('closeSettings').addEventListener('click',()=>settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click',e=>{if(e.target===settingsOverlay)settingsOverlay.classList.remove('open');});
toggleAnim.addEventListener('change',()=>{settings.anim=toggleAnim.checked;saveSettings();applyAnim();});

// nav
document.getElementById('prevMonth').addEventListener('click',()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}renderAll();});
document.getElementById('nextMonth').addEventListener('click',()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}renderAll();});
document.getElementById('prevYear').addEventListener('click',()=>{viewYear--;renderAll();});
document.getElementById('nextYear').addEventListener('click',()=>{viewYear++;renderAll();});
document.getElementById('btnToday').addEventListener('click',()=>{viewYear=now.getFullYear();viewMonth=now.getMonth();selectedKey=toKey(viewYear,viewMonth,now.getDate());renderAll();});
selYear.addEventListener('change',()=>{viewYear=parseInt(selYear.value,10);renderAll();});
selMonth.addEventListener('change',()=>{viewMonth=parseInt(selMonth.value,10);renderAll();});

renderAll();
})();
</script>
